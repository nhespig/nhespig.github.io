<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f1231">
<title>梅酒團購單｜限定優惠價</title>
<style>
:root{--plum:#6f1231;--dark:#4b0c22;--amber:#a8510b;--ink:#241c1e;--muted:#756b6e;--line:#ded8d9;--soft:#f3f5f0}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif;background:#fff}button,input{font:inherit}button{cursor:pointer}.top{height:68px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1250px)/2))}.brand{display:flex;align-items:center;gap:10px;font-family:serif;font-weight:700;letter-spacing:.12em}.brand i{font-style:normal;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--plum);color:var(--plum)}.layout{width:min(1250px,calc(100% - 40px));margin:auto;display:grid;grid-template-columns:1fr 320px;gap:38px}.hero{min-height:235px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font:700 clamp(44px,5vw,68px) serif;color:var(--dark);letter-spacing:.08em;margin:0 0 20px}.offer{font:24px serif;color:var(--amber);margin:0 0 10px}.offer strong{font-size:34px}.intro{color:var(--muted);line-height:1.7}.still{width:260px;height:150px;position:relative;background:radial-gradient(ellipse at center,#eee8dc,transparent 68%)}.glass{position:absolute;left:65px;bottom:18px;width:90px;height:95px;border:2px solid #999;border-radius:7px 7px 22px 22px;background:linear-gradient(transparent 32%,#a96c20 33%,#d59839 80%,transparent 81%)}.plum{position:absolute;right:26px;bottom:25px;width:54px;height:54px;border-radius:50%;background:#7b8536;color:white;display:grid;place-items:center;font-size:12px}.identity{margin:20px 0;padding:15px 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px;background:var(--soft);border:1px solid #dce0d6;border-radius:8px}.identity label{display:grid;grid-template-columns:92px 1fr;align-items:center;font-family:serif;font-weight:700}.identity input{height:46px;padding:0 13px;border:1px solid #d5d1d2;border-radius:6px;background:#fff}.title{display:flex;justify-content:space-between;align-items:end;margin:28px 0 10px}.title h2{font:26px serif;margin:0}.title p{color:var(--muted);font-size:13px;margin:5px 0}.labels,.wine{display:grid;grid-template-columns:minmax(250px,1fr) 95px 115px 125px;gap:12px;align-items:center}.labels{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:#52644f}.wine{min-height:92px;padding:12px;border-bottom:1px solid var(--line)}.wine.on{background:#fbf5f6;box-shadow:inset 3px 0 var(--plum)}.wine h3{font:18px serif;margin:0 0 5px}.wine small{color:var(--muted)}del{color:#71686a}.price{color:var(--amber);font:23px serif}.qty{display:grid;grid-template-columns:36px 42px 36px}.qty>*{height:38px;border:1px solid #d8d2d3;background:white;display:grid;place-items:center}.qty span{border-left:0;border-right:0}.qty button:first-child{border-radius:6px 0 0 6px}.qty button:last-child{border-radius:0 6px 6px 0}.side{position:sticky;top:20px;margin-top:28px;border:1px solid #eee;border-radius:9px;box-shadow:0 18px 50px #4b0c2212;overflow:hidden}.side h2{font:25px serif;letter-spacing:.08em;color:white;background:var(--plum);margin:0;padding:20px 22px}.totals{padding:20px 22px}.totals p{display:flex;justify-content:space-between;align-items:center}.totals strong{font:26px serif;color:var(--plum)}.lines{margin:0 22px;padding:12px 0;border-block:1px dashed #bbb;max-height:240px;overflow:auto}.lines p{display:flex;justify-content:space-between;gap:8px;font-size:12px}.empty{text-align:center;color:#999;padding:24px}.submit{width:calc(100% - 44px);margin:18px 22px 9px;padding:15px;border:0;border-radius:6px;background:var(--plum);color:#fff;font:700 20px serif}.note,.error{margin:5px 22px 18px;font-size:11px;color:var(--muted);line-height:1.6}.error{color:#a12626;background:#fff0f0;padding:9px;border-radius:5px}.success{margin:18px 22px;padding:16px;text-align:center;background:#eef4ec;color:#385136;border-radius:6px}.age{text-align:center;padding:15px;background:#171515;color:#fff;font-weight:700;letter-spacing:.16em}.catalog{padding-bottom:55px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:fixed;z-index:4;left:0;right:0;bottom:0;top:auto;margin:0;border-radius:0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.side h2,.lines,.note{display:none}.totals{padding:0}.totals p:first-child{display:none}.totals p{margin:0}.copy,.submit{width:auto;margin:0;padding:12px 16px}.catalog{padding-bottom:110px}}
@media(max-width:620px){.layout{width:calc(100% - 28px)}.hero{min-height:auto;padding:34px 0}.still{display:none}h1{font-size:43px}.identity{grid-template-columns:1fr;gap:12px;padding:13px}.identity label{grid-template-columns:82px 1fr}.labels{display:none}.wine{grid-template-columns:1fr 108px}.wine h3{font-size:16px}.wine del,.wine .price{grid-column:1}.qty{grid-column:2;grid-row:1/4;grid-template-columns:32px 38px 32px}}
.wine{grid-template-columns:82px minmax(180px,1fr) 95px 115px 125px;min-height:118px;padding:10px 12px}.photo{width:68px;height:94px;display:grid;place-items:center;background:#faf9f7;border-radius:6px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}@media(max-width:620px){.wine{grid-template-columns:60px 1fr 108px}.photo{width:54px;height:80px;grid-row:1/4}.wine del,.wine .price{grid-column:2}.qty{grid-column:3}}
.copy{width:calc(100% - 44px);margin:14px 22px 0;padding:11px;border:1px solid var(--plum);border-radius:6px;background:#fff;color:var(--plum);font-weight:700}.copy:disabled{cursor:not-allowed;opacity:.45}.copy+.submit{margin-top:10px}.edit-order{margin-top:12px;padding:9px 15px;border:1px solid #385136;border-radius:5px;background:#fff;color:#385136;font-weight:700}@media(max-width:900px){.copy{width:auto;margin:0;padding:12px 16px}.success{position:fixed;left:12px;right:12px;bottom:82px;z-index:6;box-shadow:0 8px 30px #0002}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i>梅</i><span>梅酒團購單</span></div></header>
<main class="layout"><div><section class="hero"><div><h1>梅酒團購單</h1><p class="offer">限定團購優惠 <strong>NT$500 起</strong></p><p class="intro">各款優惠價依商品標示，填寫資料後送出。我們會統一彙整訂單與收款。</p></div><div class="still" aria-hidden="true"><span class="glass"></span><span class="plum">梅</span></div></section>
<section class="identity"><label>姓名<input id="name" placeholder="請輸入姓名" autocomplete="name"></label><label>處室／班級<input id="department" placeholder="例如：教務處、六年一班"></label></section>
<section class="catalog"><div class="title"><div><h2>選擇梅酒</h2><p>依最新價格與庫存更新；售完品項已下架</p></div><small>共 26 款</small></div><div class="labels"><span>商品</span><span>原價</span><span>團購價</span><span>數量</span></div><div id="wines"></div></section></div>
<aside class="side"><h2>訂購摘要</h2><div class="totals"><p><span>總瓶數</span><strong><b id="count">0</b> 瓶</strong></p><p><span>總金額</span><strong id="total">NT$0</strong></p></div><div class="lines" id="lines"><div class="empty">尚未選擇商品</div></div><button class="copy" id="copyOrder" disabled>複製訂單內容</button><div id="message"></div><button class="submit" id="submit">送出團購單</button><p class="note">▣ 訂單將送至 Google 表單，方便團主對帳與收款追蹤。</p></aside></main>
<footer class="age">禁止酒駕　未滿十八歲禁止飲酒</footer>
<script>
const DEFAULT_PRICE=750,FORM="https://docs.google.com/forms/d/e/1FAIpQLSeXSofL83XWBZB28_B_v-Rp5qkVq-WYP5wcLLkYxEd-3HGmxg/formResponse";
const SOLD_OUT=new Set(["皇家典藏梅酒","好醋多 狂梅酒 香甜蜜桃風味"]),SPECIAL_PRICE={"夜山明 潮酒":500,"威士忌40.17%":900,"梅子蒸餾酒(大)":900,"威士忌梅酒":650,"完熟梅酒":650,"青梅酒":650,"好醋多 狂梅酒 清爽純柚風味":650},LIMITED_STOCK={"青梅竹馬梅酒":5,"葡萄梅酒":5};
const DATA=[["封梅梅酒",1380,"ff6a5c20359043fa988ab6daa1aeb66b"],["綠茶梅酒",1080,"8a3bbe440d7c4d7e94663de352950f38"],["玫瑰甘蔗(荔枝風味)酒",1080,"00196d9530f1441fb128fbf5a3fc5f78"],["皇家沉年梅酒",1280,"d1773c4813d744bf84868c5493d36d3e"],["本格梅酒",1280,"317294408b6345fe982f7be5b528775d"],["紀梅梅酒",1380,"288fd47e01ea464dbdb72b81db6fa180"],["夜山明 潮酒",780,"0b9471f9568a49a69c834737eefeb1b7"],["威士忌40.17%",1280,"87782744d2634a82b266bea839b8c541"],["橙酒",1080,"9f20cbdd394d4941ac99557793f438ac"],["紅茶梅酒",1080,"b5d58de3d22b4bce82abf4568c35719e"],["皇家典藏梅酒",1380,"80a1335c0aaa4b998d60610562fcee66"],["芋見台灣 金箔酒",1200,"96bda4dd594d4bfba6f7e77541a8ae29"],["9號梅酒",1380,"b0642ab654d6482195cbdd794aafaf6e"],["青梅酒",880,"0c91dcdc37bd43ddad7bc0449378085e"],["梅姬 威士忌梅酒",1280,"d631ad72174048d3b266b09fe83bd9a1"],["梅姬 青梅酒",1280,"dad0de7b2c864aa1a36a973bad2296bd"],["梅姬 完熟梅酒",1280,"52b196bb4d7d41aaaa0d2fc714f2af90"],["皇家荔枝冰酒",1280,"dc9c1b67539c464b964a3247958d8a96"],["皇家御藏梅酒",1280,"e937650cf3d8478d8b8f8ba85a34f477"],["皇家尊爵梅酒",1280,"9423900754c74edb972dfdf286c65732"],["皇家頂級梅酒",1280,"47fa8fa9f68a4a61a1f1065aa5f99dae"],["好醋多 狂梅酒 香甜蜜桃風味",880,"e4f7e21a2c014f498c4366c760c632f1"],["好醋多 狂梅酒 清爽純柚風味",880,"86c879031a6a4a8d8e91e1b4e7e7629a"],["梅子蒸餾酒(大)",1280,"78979133aea94bdead092acdb1d3b5ea"],["青梅竹馬梅酒",880,"ae33f2e9f1834f91a30296aafa6b80d9"],["葡萄梅酒",880,"8b58dcb7af854d11afe3e034fc4e6256"],["威士忌梅酒",880,"72395c73f9a649eeb7aed75b28dd1213"],["完熟梅酒",880,"d2f9718fb811469ea44a4b013ff1568d"]].filter(x=>!SOLD_OUT.has(x[0])).map((x,i)=>({id:"p"+i,name:x[0],original:x[1],price:SPECIAL_PRICE[x[0]]||DEFAULT_PRICE,stock:LIMITED_STOCK[x[0]]||null,image:`https://static.wixstatic.com/media/63f25f_${x[2]}~mv2.jpg/v1/fill/w_500,h_700,al_c,q_90/63f25f_${x[2]}~mv2.jpg`}));
const order={},nameInput=document.getElementById("name"),departmentInput=document.getElementById("department");const money=n=>"NT$"+n.toLocaleString("zh-TW");const orderId="PW-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();let revision=0,lastSubmittedAt="";
function draw(){wines.innerHTML=DATA.map(x=>`<article class="wine ${order[x.id]?"on":""}"><a class="photo" href="${x.image}" target="_blank" rel="noopener"><img src="${x.image}" alt="${x.name}" loading="lazy"></a><div><h3>${x.name}</h3><small>${x.stock?`限量 ${x.stock} 瓶`:`梅酒團購限定`}</small></div><del>${money(x.original)}</del><strong class="price">${money(x.price)}</strong><div class="qty"><button onclick="change('${x.id}',-1)">−</button><span>${order[x.id]||0}</span><button onclick="change('${x.id}',1)" ${(x.stock&&order[x.id]>=x.stock)?"disabled":""}>＋</button></div></article>`).join("");summary()}
function change(id,d){const item=DATA.find(x=>x.id===id),max=item.stock||99;order[id]=Math.min(max,Math.max(0,(order[id]||0)+d));if(!order[id])delete order[id];draw()}
function selected(){return DATA.filter(x=>order[x.id])}function orderTotal(){return selected().reduce((sum,x)=>sum+order[x.id]*x.price,0)}function summary(){const n=Object.values(order).reduce((a,b)=>a+b,0),amount=orderTotal();count.textContent=n;total.textContent=money(amount);copyOrder.disabled=!n;lines.innerHTML=n?selected().map(x=>`<p><span>${x.name}</span><span>${order[x.id]} 瓶　${money(order[x.id]*x.price)}</span></p>`).join(""):`<div class="empty">尚未選擇商品</div>`}
function orderText(){const n=Object.values(order).reduce((a,b)=>a+b,0),who=nameInput.value.trim()||"未填寫",dept=departmentInput.value.trim()||"未填寫";return [`梅酒團購單`,`姓名：${who}`,`處室／班級：${dept}`,``,...selected().map(x=>`${x.name} × ${order[x.id]} 瓶（單價 ${money(x.price)}，小計 ${money(order[x.id]*x.price)}）`),``,`總瓶數：${n} 瓶`,`總金額：${money(orderTotal())}`].join("\n")}
copyOrder.onclick=async()=>{const text=orderText();try{await navigator.clipboard.writeText(text)}catch(e){const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();document.execCommand("copy");area.remove()}const old=copyOrder.textContent;copyOrder.textContent="已複製！";setTimeout(()=>copyOrder.textContent=old,1600)};
function editOrder(){message.innerHTML='<p class="success"><strong>正在修正第 '+(revision+1)+' 版訂單</strong><br><small>修改完成後請按「送出修正版」。</small></p>';submit.textContent="送出修正版";nameInput.focus();window.scrollTo({top:0,behavior:"smooth"})}
submit.onclick=async()=>{const n=nameInput.value.trim(),d=departmentInput.value.trim(),items=selected(),bottles=Object.values(order).reduce((a,b)=>a+b,0),amount=orderTotal();message.innerHTML="";if(!n||!d||!bottles){message.innerHTML='<p class="error">請填寫姓名、處室／班級，並至少選擇 1 瓶梅酒。</p>';return}submit.disabled=true;submit.textContent="送出中…";const nextRevision=revision+1,submittedAt=new Date().toLocaleString("zh-TW",{hour12:false}),detail=items.map(x=>`${x.name} × ${order[x.id]}（單價 ${money(x.price)}）`).join("、");const body=new URLSearchParams({"entry.1656839390":orderId,"entry.7300578":String(nextRevision),"entry.1070703038":n,"entry.1065283080":d,"entry.246722880":detail,"entry.1512603954":String(bottles),"entry.1061784250":String(amount),"entry.1345246224":submittedAt});try{await fetch(FORM,{method:"POST",mode:"no-cors",body});revision=nextRevision;lastSubmittedAt=submittedAt;message.innerHTML=`<div class="success"><strong>已送出</strong><br><small>送出時間：${submittedAt}<br>訂單編號：${orderId}｜版本 ${revision}</small><br><button class="edit-order" type="button" onclick="editOrder()">修正訂單</button></div>`}catch(e){message.innerHTML='<p class="error">送出失敗，請稍後再試。</p>'}finally{submit.disabled=false;submit.textContent=revision?"再次送出修正版":"送出團購單"}};draw();
</script>
</body></html>
